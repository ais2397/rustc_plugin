[package]
name = "rustc-plugin"
version = "0.0.1"
edition = "2021"
authors = ["Will Crichton <crichton.will@gmail.com>"]
description = "A framework for writing plugins that integrate with the Rust compiler"
repository = "https://github.com/cognitive-engineering-lab/rustc-plugin"
license = "MIT"

[package.metadata.rust-analyzer]
rustc_private = true

[dependencies]
rustc_tools_util = "0.1"
log = "0.4"
#github 
cargo_metadata = { git = "https://github.com/oli-obk/cargo_metadata.git", tag = "0.14.3" }
serde = "1"
serde_json = "1"
cargo-platform = "=0.1.2"


[dev-dependencies]
anyhow = {version = "1", features = ["backtrace"]}

[build-dependencies]
toml = "0.6.0"